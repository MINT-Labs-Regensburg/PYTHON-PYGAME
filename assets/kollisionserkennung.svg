<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Wie erkennt das Programm eine Rechteckkollision?</title>
  <desc id="description">Zwei Rechtecke ueberlappen. Das Programm prueft die Ueberlappung getrennt auf der waagerechten und senkrechten Achse. Nur wenn beide Tests wahr sind, liegt eine Kollision vor.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#dbe4e8" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536773"/>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #182a33; }
      .muted { fill: #536773; }
      .small { font-size: 15px; }
      .label { font-size: 17px; font-weight: 700; }
      .formula { font-family: 'DejaVu Sans Mono', monospace; font-size: 18px; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f4f7f5"/>
  <rect x="0" y="0" width="1200" height="12" fill="#087e75"/>
  <text x="56" y="66" font-size="34" font-weight="700">Wann kollidieren zwei Rechtecke?</text>
  <text x="58" y="98" font-size="18" class="muted">Die Kanten vergleichen: erst waagerecht, dann senkrecht.</text>

  <rect x="56" y="128" width="510" height="390" rx="8" fill="#ffffff" stroke="#d6e0e2" stroke-width="2"/>
  <text x="80" y="165" font-size="20" font-weight="700">1. Rechtecke auf der Fl&#228;che</text>
  <rect x="82" y="188" width="458" height="285" fill="url(#grid)"/>
  <line x1="100" y1="448" x2="516" y2="448" stroke="#536773" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="100" y1="448" x2="100" y2="205" stroke="#536773" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="470" class="small muted">x</text>
  <text x="82" y="211" class="small muted">y</text>

  <rect x="208" y="292" width="174" height="126" fill="#2385c7" fill-opacity="0.72" stroke="#12669f" stroke-width="3"/>
  <rect x="318" y="238" width="174" height="126" fill="#e45645" fill-opacity="0.68" stroke="#bd3b32" stroke-width="3"/>
  <rect x="318" y="292" width="64" height="72" fill="#23a77b" fill-opacity="0.95" stroke="#087e60" stroke-width="2"/>
  <line x1="208" y1="281" x2="208" y2="292" stroke="#12669f" stroke-width="2"/>
  <circle cx="208" cy="292" r="4" fill="#12669f"/>
  <text x="208" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#12669f">x1</text>
  <line x1="318" y1="227" x2="318" y2="238" stroke="#bd3b32" stroke-width="2"/>
  <circle cx="318" cy="238" r="4" fill="#bd3b32"/>
  <text x="318" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#bd3b32">x2</text>
  <text x="218" y="322" fill="#ffffff" font-size="15" font-weight="700">beweglich</text>
  <text x="395" y="261" fill="#ffffff" font-size="15" font-weight="700">fest</text>
  <line x1="318" y1="383" x2="382" y2="383" stroke="#087e60" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="393" y="410" font-size="14" fill="#087e60" font-weight="700">gemeinsame Fl&#228;che</text>

  <rect x="590" y="128" width="554" height="390" rx="8" fill="#ffffff" stroke="#d6e0e2" stroke-width="2"/>
  <text x="616" y="165" font-size="20" font-weight="700">2. &#220;berlappung auf jeder Achse</text>
  <text x="618" y="205" class="label">Waagerecht (X)</text>
  <text x="618" y="235" class="formula">x1 &lt; x2 + size2</text>
  <text x="618" y="262" class="small muted">Der linke Rand von Rechteck 1 liegt vor dem rechten Rand</text>
  <text x="618" y="280" class="small muted">von Rechteck 2.</text>
  <text x="618" y="294" class="formula">x1 + size1 &gt; x2</text>
  <text x="618" y="321" class="small muted">Der rechte Rand von Rechteck 1 liegt hinter dem linken</text>
  <text x="618" y="339" class="small muted">Rand von Rechteck 2.</text>
  <line x1="660" y1="366" x2="1090" y2="366" stroke="#536773" stroke-width="2"/>
  <line x1="700" y1="356" x2="895" y2="356" stroke="#2385c7" stroke-width="10" stroke-linecap="round"/>
  <line x1="820" y1="376" x2="1015" y2="376" stroke="#e45645" stroke-width="10" stroke-linecap="round"/>
  <line x1="820" y1="366" x2="895" y2="366" stroke="#23a77b" stroke-width="12"/>
  <text x="618" y="417" class="label">Senkrecht (Y)</text>
  <text x="618" y="447" class="formula">y1 &lt; y2 + size2</text>
  <text x="618" y="474" class="small muted">Die Kanten muessen sich auch senkrecht &#252;berlappen.</text>
  <text x="618" y="502" class="formula">y1 + size1 &gt; y2</text>

  <rect x="56" y="540" width="1088" height="164" rx="8" fill="#17343a"/>
  <text x="84" y="580" fill="#ffffff" font-size="19" font-weight="700">3. Beide Tests muessen stimmen</text>
  <rect x="84" y="600" width="270" height="48" rx="6" fill="#dceef8"/>
  <text x="219" y="631" text-anchor="middle" font-size="18" font-weight="700" fill="#12669f">X-Ueberlappung: wahr</text>
  <text x="382" y="632" fill="#ffffff" font-size="24" font-weight="700">UND</text>
  <rect x="452" y="600" width="270" height="48" rx="6" fill="#dceef8"/>
  <text x="587" y="631" text-anchor="middle" font-size="18" font-weight="700" fill="#12669f">Y-Ueberlappung: wahr</text>
  <text x="750" y="632" fill="#ffffff" font-size="24" font-weight="700">=</text>
  <rect x="800" y="594" width="310" height="60" rx="6" fill="#23a77b"/>
  <text x="955" y="632" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Kollision: wahr</text>
  <text x="84" y="681" fill="#d4e1e2" font-size="15">Im Code: rect2 ist beweglich und liefert x1/y1/size1; rect1 ist fest und liefert x2/y2/size2.</text>
</svg>
